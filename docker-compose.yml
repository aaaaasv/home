services:
  # the household message broker. the bot publishes the air conditioner here as a thermostat, homebridge
  # turns that into a tile on a phone, and zigbee2mqtt will join the same broker when the dongle goes in
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    # the same host user as the bot, so ./data stays one ownership and the backup can read all of it
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # loopback only: homebridge runs on the host network and reaches 127.0.0.1, the bot reaches
    # `mosquitto` over this compose network, and nothing on the lan can subscribe to the house
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./data/mosquitto:/mosquitto/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # the zigbee coordinator's software half. it owns the usb dongle, forms the mesh and publishes every
  # device onto the same broker the bot already uses — deliberately not home assistant, which would add a
  # second interface the family would have to learn
  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:latest
    container_name: zigbee2mqtt
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      TZ: ${TIMEZONE:-Europe/Kyiv}
    ports:
      - "${ZIGBEE_FRONTEND_PORT:-8099}:8099"
    volumes:
      - ./data/zigbee2mqtt:/app/data
      # udev lets the container resolve the stable by-id path the device is mapped from
      - /run/udev:/run/udev:ro
    devices:
      # the by-id path, never /dev/ttyUSB0: that number moves the moment anything else is plugged in
      - "${ZIGBEE_ADAPTER_PATH:?set the dongle by-id path in .env}:/dev/ttyACM0"
    group_add:
      - "${DIALOUT_GROUP_ID:-20}"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # the apple bridge. it reads what the bot publishes and shows it as an ordinary accessory on a phone —
  # a tile, the control centre, siri. it makes no decisions of its own: everything it sends back is a tap
  homebridge:
    image: homebridge/homebridge:latest
    container_name: homebridge
    # homekit is discovered over mdns/bonjour, and that does not cross a docker bridge network. on the
    # default network the iphone simply never finds this bridge, and nothing anywhere reports an error
    network_mode: host
    environment:
      TZ: ${TIMEZONE:-Europe/Kyiv}
      PUID: ${HOST_UID:-1000}
      PGID: ${HOST_GID:-1000}
      HOMEBRIDGE_CONFIG_UI_PORT: 8581
    volumes:
      - ./data/homebridge:/homebridge
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    # no build here on purpose: the pi runs a published image and never compiles. use
    # docker-compose.local.yml to build on this machine instead
    image: ${BOT_IMAGE:-ghcr.io/aaaaasv/home-bot}:${BOT_VERSION:-latest}
    container_name: home-bot
    pull_policy: always
    # run as the host user so the sqlite file and photos stay writable/backupable from outside the container
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    env_file: .env
    # the specimen sheets, for whoever taps an nfc tag on a pot. lan only — never map this to a public
    # interface: reading is deliberately unauthenticated, and the action token lives in the tag
    ports:
      - "${WEB_HOST_PORT:-8080}:${WEB_PORT:-8080}"
    environment:
      TZ: ${TIMEZONE:-Europe/Kyiv}
      DATABASE_PATH: /app/data/home.db
      PHOTO_STORAGE_PATH: /app/data/photos
    volumes:
      - ./data:/app/data
      # ecoflow delta 2 is reached over local ble via bluez on the host system bus; the container
      # (uid 1000) talks to it through the shared dbus socket + membership in the host bluetooth
      # group — no privileged, no host network (inert while ECOFLOW_ENABLED is false)
      - /var/run/dbus:/var/run/dbus
    # the sht31 climate sensor lives on the pi's i2c bus; the container runs as uid 1000, so it
    # needs the device node plus membership in the host's i2c group to open it (inert while
    # CLIMATE_SENSOR_ENABLED is false)
    devices:
      - /dev/i2c-1:/dev/i2c-1
    group_add:
      - "${I2C_GROUP_ID:-994}"
      - "${BLUETOOTH_GROUP_ID:-108}"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
