# the household broker: the bot publishes what it knows, homebridge reads it, zigbee2mqtt will write into it
listener 1883

# no password, and that is deliberate: the port is published on loopback only, so the sole way in is from
# the pi itself or from a container on this compose network. give it a password file the day it has to
# listen on the lan
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

# retained state is the whole point — a controller that starts later must see the current reading, not a
# blank tile — so it has to survive a broker restart too
autosave_interval 30

log_dest stdout
log_type warning
log_type error
